spring.application.name=NextNa
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5123/nextna_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nextna}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nextna_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
server.port=${PORT:8080}
