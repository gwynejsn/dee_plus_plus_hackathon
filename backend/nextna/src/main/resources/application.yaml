spring:
  application:
    name: NextNa
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5123/nextna_db}
    username: ${SPRING_DATASOURCE_USERNAME:nextna}
    password: ${SPRING_DATASOURCE_PASSWORD:nextna_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
