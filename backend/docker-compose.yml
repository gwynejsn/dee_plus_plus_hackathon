services:
  postgres:
    image: postgres:16-alpine
    container_name: nextna-postgres
    restart: always
    environment:
      POSTGRES_DB: nextna_db
      POSTGRES_USER: nextna
      POSTGRES_PASSWORD: nextna_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextna -d nextna_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: nextna-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
