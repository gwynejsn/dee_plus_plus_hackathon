services:
  postgres:
    image: postgres:16-alpine
    container_name: nextna-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextna_db}
      POSTGRES_USER: ${POSTGRES_USER:-nextna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextna_secret}
    ports:
      - "5123:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextna} -d ${POSTGRES_DB:-nextna_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: nextna-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend/NextNa
      dockerfile: Dockerfile
    container_name: nextna-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nextna_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nextna}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nextna_secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
